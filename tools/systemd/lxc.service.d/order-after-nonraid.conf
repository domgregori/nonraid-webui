[Unit]
# Wait for the array to have had its own shot at assembling/mounting (nonraid.service) before
# lxc.service autostarts any container with lxc.start.auto=1. If a container's storage is ever
# relocated onto an array disk (Settings -> Docker & LXC Storage), starting it before the array is
# mounted would otherwise have it come up against an empty/missing rootfs instead of failing
# loudly. nonraid-webui's own explicit autostart trigger (restoreDockerAndAutostartLxc(), run from
# /array/start) is already correctly gated behind a confirmed array start - this drop-in closes
# the same gap for lxc.service's own independent autostart at a real host boot, which nothing in
# this app previously ordered.
#
# Ordering only, not a hard Requires= - nonraid.service's own ExecStart lines are all best-effort
# and never fail the unit even if the array itself didn't actually come up (missing disks, etc.),
# so this can't guarantee success, only sequencing. nonraid-webui's own boot-time check
# (backend/src/index.ts) covers the "ordering was right but the array still isn't up" case with a
# notification instead.
#
# Installed unconditionally by tools/install-webui.sh, regardless of LXC's current storage
# location, so relocating it onto the array later doesn't need a separate step to pick this up.
After=nonraid.service
Wants=nonraid.service

# nonraid-webui's own minimal smb.conf - installed in place of the samba package's stock sample
# file, which ships with [homes]/[printers]/[print$] shares enabled by default. This app has no
# printer-sharing feature and no per-Unix-user home-directory concept to expose, so those just
# showed up as unexplained noise ("nobody", "print$") in network-browse tools (Finder, GNOME
# Files) alongside the shares actually configured through the app. Everything below [global] is
# only what this app's own SMB functionality (guest access, Samba/Unix password sync) actually
# relies on - see backend/README.md for the full picture.
#
# Real shares live entirely between the markers below - never hand-edit that block, it's
# rewritten wholesale by backend/src/shares/applier/realApplier.ts every time shares change.
[global]
   workgroup = WORKGROUP
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d
   server role = standalone server
   obey pam restrictions = yes
   unix password sync = yes
   passwd program = /usr/bin/passwd %u
   passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .
   pam password change = yes
   map to guest = bad user
   usershare allow guests = yes

# === nonraid-webui:managed-shares:begin ===
# === nonraid-webui:managed-shares:end ===

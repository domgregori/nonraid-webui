<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // Applies a stored light/dark theme preference before first paint, so
      // switching themes doesn't cause a flash of the wrong one on load. No
      // preference stored means "system" — leaves data-theme unset, letting
      // tokens.css's prefers-color-scheme media query decide.
      (function () {
        try {
          var t = localStorage.getItem('nonraid-theme-preference');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Barlow+Condensed:wght@300&family=Roboto:wght@900&display=swap"
      rel="stylesheet"
    />
    <title>NonRAID dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
